[project]
name = "fplbot"
version = "0.1.0"
description = "Automated Fantasy Premier League manager: ingest -> project -> optimise -> (judge) -> execute"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pulp>=2.8,<3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
fplbot = "fplbot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fplbot*"]
